spring:
  application:
    name: forge

  datasource:
    url: jdbc:postgresql://localhost:5434/forge
    username: forge
    password: forge
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6381

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

forge:
  worker:
    pool-size: 4
    queue-capacity: 100
  retry:
    initial-delay-ms: 1000
    backoff-multiplier: 2.0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
